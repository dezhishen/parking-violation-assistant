name: Build Go+Vue App (Windows)

permissions:
  contents: read

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  check:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # go:embed 需要 frontend/dist 存在，这里只需要占位目录
      - name: Stub embed dir
        run: |
          mkdir -p frontend/dist
          [ -f frontend/dist/index.html ] || echo '<!doctype html>' > frontend/dist/index.html

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend dist
        run: node scripts/verify_frontend_dist.mjs

      # 前端产物与平台无关，构建一次供两个平台复用
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify frontend dist
        run: node scripts/verify_frontend_dist.mjs

      - name: Prepare ONNX OCR assets (Windows)
        run: node scripts/prepare_onnx_ocr_assets.mjs --os windows --dist dist

      - name: Build Go binary (Windows)
        run: go build -ldflags="-s -w" -o dist/CountCar.exe .

      - name: Package release bundle (Windows)
        shell: pwsh
        run: |
          if (Test-Path dist/CountCar-windows-amd64.zip) {
            Remove-Item dist/CountCar-windows-amd64.zip -Force
          }
          Compress-Archive -Path dist/CountCar.exe, dist/ocr -DestinationPath dist/CountCar-windows-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountCar-windows
          path: |
            dist/CountCar.exe
            dist/CountCar-windows-amd64.zip
            dist/ocr/**

  build-linux:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify frontend dist
        run: node scripts/verify_frontend_dist.mjs

      - name: Prepare ONNX OCR assets (Linux)
        run: node scripts/prepare_onnx_ocr_assets.mjs --os linux --dist dist

      - name: Build Go binary (Linux)
        run: go build -ldflags="-s -w" -o dist/CountCar .

      - name: Package release bundle (Linux)
        run: tar -czf dist/CountCar-linux-amd64.tar.gz -C dist CountCar ocr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountCar-linux
          path: |
            dist/CountCar
            dist/CountCar-linux-amd64.tar.gz
            dist/ocr/**

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - check
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: CountCar-windows
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: CountCar-linux
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows/CountCar-windows-amd64.zip
            dist/linux/CountCar-linux-amd64.tar.gz
